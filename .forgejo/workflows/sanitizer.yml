# ASan+UBSan / TSan 手动验证；两配置共享单重任务并发组。
# 与本地回归一致：GCC14、O0/g0、-j1，保留 leak/UB/race 检测。
# runtime 预检失败会判红；不修改 sysctl、ASLR、preload 配置或安装包。
# 最小 runtime 成功不代表全套测试成功，完整 CTest 输出独立保留。
name: sanitizer（手动）

on:
  workflow_dispatch:

concurrency:
  group: cue-selfhosted
  cancel-in-progress: false

jobs:
  asan:
    name: ASan+UBSan（手动、SDL）
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 实际 runtime 预检
        run: python3 scripts/ci-sanitizer-preflight.py address,undefined
      - name: 全量配置、构建、CTest与身份记录
        run: python3 scripts/ci-regression.py --build-dir build-asan --sdl ON --sanitize address,undefined --out "${RUNNER_TEMP:-/tmp}/cue-asan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"

  tsan:
    name: TSan（手动、SDL）
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 实际 runtime 预检（不更改系统设置）
        run: python3 scripts/ci-sanitizer-preflight.py thread
      - name: 独立目录全量配置、构建、CTest与身份记录
        run: python3 scripts/ci-regression.py --build-dir build-tsan --sdl ON --sanitize thread --out "${RUNNER_TEMP:-/tmp}/cue-tsan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
