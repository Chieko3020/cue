# Forgejo Actions: GCC14; SDL ON / OFF full builds and CTest run serially.
# Resource budget: 2 vCPU / 2 GiB, -O0 -DNDEBUG -g0 and -j1.
# Existing system toolchain/dependencies only; browser job uses installed Vite/Playwright.
# Missing browser prerequisites explicitly mean NOT EXECUTED, never browser acceptance.
# Sanitizer jobs remain manual in sanitizer.yml and never change host settings.
# Exact registration, per-test results, flags and source/binary hashes stay on runner disk.
# Windows: scripts/check-windows-clients.sh is a native MSYS2 entry; no Windows runner
# is configured here and Linux jobs do not establish Windows or physical-device acceptance.
name: ci（常驻：build + ac13 + e2e；sanitizer 见 sanitizer.yml）

on:
  push:
    branches: [main]
  pull_request:
  # T-18b：fuzz 一次 3×60 s，不进 push/PR 的常驻路径，只能手动触发。
  # Forgejo 网页的「Run workflow」按钮或 forgejo-cli 都能触发它。
  workflow_dispatch:

# 并发护栏：本机 2 vCPU / 1967 MB，runner 的 capacity 已经是 1（同一时刻只有一个 job），
# 这条是跨 workflow 的第二道闸（例如 ci 与别的 workflow 同时触发时）。
# cancel-in-progress=false：已经在跑的构建不要被后来的 push 掐掉——半截的 ctest 结果
# 比没有结果更糟，重跑一次要几分钟。用固定 group 名而不是表达式：Forgejo 对
# concurrency 里表达式的支持不全，固定组名是确定生效的最小写法。
concurrency:
  group: cue-selfhosted
  cancel-in-progress: false

jobs:
  build:
    name: SDL / no-SDL full build + CTest (g++-14)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 两配置串行全量回归（O0/g0、-j1、无安装）
        run: |
          set -eu
          g++-14 --version | head -1
          cmake --version | head -1
          python3 scripts/ci-regression.py --build-dir build-ci-sdl --sdl ON --out "${RUNNER_TEMP:-/tmp}/cue-sdl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          python3 scripts/ci-regression.py --build-dir build-ci-off --sdl OFF --out "${RUNNER_TEMP:-/tmp}/cue-off-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"

  # AC-13（前端无外部 CDN、断网可加载）的可执行证据（T-17a）。
  # 为什么独立成一个 job：不需要浏览器、不需要网络、不需要 npm，所以永远能跑；
  # e2e-console 因缺 playwright 跳过时，这一层证据仍然在。
  ac13-static:
    name: AC-13 前端无外部 URL（静态扫描）
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 web/ 与 web/dist（若存在）
        run: python3 scripts/check-no-external-cdn.py



  e2e-console:
    name: e2e-console（缺 dist/playwright 时显式跳过）
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 现有浏览器依赖预检、前端构建与两套实际 e2e
        run: bash scripts/ci-browser.sh build-e2e

  # 手动触发的 libFuzzer（T-18b）：三个 proto 解析入口各 60 s。
  # 不进 push/PR 路径：3 分钟 × 本机 2 vCPU 会拖长每次提交的反馈时间。
  fuzz:
    name: fuzz proto（手动，3×60 s）
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 配置与构建（CUE_FUZZ=ON；缺 clang 则显式跳过）
        run: |
          set -eu
          if command -v clang++-18 >/dev/null 2>&1; then
            FUZZ_CXX=clang++-18
          elif command -v clang++ >/dev/null 2>&1; then
            FUZZ_CXX=clang++
          else
            # 不判红：这台 runner 没装 clang 不代表代码有问题；但必须让"没跑"看得出来。
            echo "::warning::找不到 clang++（libFuzzer 随 Clang 提供），fuzz job 跳过"
            echo "===== 跳过原因 ====="
            echo "fuzz 未执行：没有 clang++；GCC 的 -fsanitize= 不支持 fuzzer 运行时。"
            echo "安装：sudo apt-get install -y clang-18 libclang-rt-18-dev"
            echo "===================="
            exit 0
          fi
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER="$FUZZ_CXX" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCUE_FUZZ=ON
          cmake --build build-fuzz --target fuzz_decode_media fuzz_decode_datagram \
            fuzz_decode_fec_header -j1

      - name: 三个入口各跑 60 s
        run: |
          set -euo pipefail
          if [ ! -x build-fuzz/fuzz_decode_media ]; then
            echo "上一步跳过了构建（缺 clang），这里不再假装跑过 fuzz"
            exit 0
          fi
          # 语料复制到临时目录：libFuzzer 会往语料目录里写新条目，不能污染工作区。
          WORK="${RUNNER_TEMP:-/tmp}/cue-fuzz"
          rm -rf "$WORK"
          mkdir -p "$WORK/artifacts"
          # 本机 /etc/ld.so.preload 预加载 libonion.so，会把 libasan 挤到第二位：
          # verify_asan_link_order=0 是这台机器上唯一的让步（见 CMakeLists.txt 的说明）。
          export ASAN_OPTIONS=verify_asan_link_order=0:detect_leaks=0
          # 二进制的名字与语料目录的名字**并不一一对应**：
          #   corpus/decode_media   → fuzz_decode_media
          #   corpus/decode_datagram→ fuzz_decode_datagram
          #   corpus/fec_header     → fuzz_decode_fec_header   （这个没有 decode_ 前缀）
          # 之前这里写的是 "./build-fuzz/fuzz_decode_$t"，而 $t 已经是 decode_media 这种
          # 带前缀的名字，拼出来是 fuzz_decode_decode_media —— 只在 CI 里报 exit 127。
          # 第一次真正跑（之前一直是 skipped）就露出来了，所以改成显式配对。
          run_one() {
            local target="$1" corpus="$2" extra="${3:-}"
            mkdir -p "$WORK/$corpus"
            cp tests/fuzz/corpus/"$corpus"/* "$WORK/$corpus/"
            echo "===== $target 60s ====="
            "./build-fuzz/$target" "$WORK/$corpus" \
              -max_total_time=60 -print_final_stats=1 $extra -artifact_prefix="$WORK/artifacts/"
          }
          # decode_media 的 FragmentTooLarge（单分片 >16 KiB）需要 >16416 字节的输入，
          # libFuzzer 默认上限 4096 到不了；另外两个入口的合法输入 ≤24/8 字节，不用放宽。
          run_one fuzz_decode_media    decode_media    "-max_len=18432"
          run_one fuzz_decode_datagram decode_datagram ""
          run_one fuzz_decode_fec_header fec_header   ""
